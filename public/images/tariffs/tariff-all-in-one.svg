<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none"><defs>
  <linearGradient id="tariff_all_in_one_white" x1="0.2" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFE3E9"/>
  </linearGradient>
  <linearGradient id="tariff_all_in_one_white2" x1="0.2" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FAFBFC"/><stop offset="1" stop-color="#CFD5DD"/>
  </linearGradient>
  <linearGradient id="tariff_all_in_one_dark" x1="0.2" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#474D57"/><stop offset="1" stop-color="#1B1E23"/>
  </linearGradient>
  <linearGradient id="tariff_all_in_one_yellow" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#F5A623"/>
  </linearGradient>
  <radialGradient id="tariff_all_in_one_glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFCC00" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFCC00" stop-opacity="0"/>
  </radialGradient>
  <filter id="tariff_all_in_one_soft" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B2430" flood-opacity="0.18"/>
  </filter>
  <filter id="tariff_all_in_one_soft2" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.16"/>
  </filter>
  <filter id="tariff_all_in_one_blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<ellipse cx="320" cy="336" rx="176" ry="20" fill="#8A93A0" opacity="0.30" filter="url(#tariff_all_in_one_blur)"/>
<circle cx="200" cy="150" r="140" fill="url(#tariff_all_in_one_glow)"/>

